kind = "mobile"
previewPath = "/"
title = "Interview Coach"
description = "A polished AI mock interview mobile app for candidates to practice role-specific interviews, review performance, and build confidence with realistic mock data in Phase 1."
version = "1.0.0"
id = "artifacts/interview-coach-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 26212

[services.development]
run = "pnpm --filter @workspace/interview-coach-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/interview-coach-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/interview-coach-mobile", "run", "serve" ]

[services.env]
PORT = "26212"
BASE_PATH = "/"
